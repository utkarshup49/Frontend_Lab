<!DOCTYPE html>
<html>
<head>
    <title>Primitive Data Types in JavaScript</title>
</head>
<body>
    <script>
        // Primitive Data Types
        let str = "Hello";          // String
        let num = 100;              // Number
        let bigNum = 12345678901234567890n; // BigInt
        let isStudent = true;       // Boolean
        let value;                  // Undefined
        let empty = null;           // Null
        let sym = Symbol("id");     // Symbol

        // Print values
        document.write("String: " + str + "<br>");
        document.write("Number: " + num + "<br>");
        document.write("BigInt: " + bigNum + "<br>");
        document.write("Boolean: " + isStudent + "<br>");
        document.write("Undefined: " + value + "<br>");
        document.write("Null: " + empty + "<br>");
        document.write("Symbol: " + sym.toString() + "<br>");
    </script>
</body>
</html>
